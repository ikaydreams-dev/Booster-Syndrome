sonar.projectKey=booster-syndrome
sonar.projectName=Booster Syndrome
sonar.projectVersion=1.0.0

sonar.sources=services
sonar.tests=tests

sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.python.version=3.11
sonar.java.source=17
sonar.go.coverage.reportPaths=coverage.out

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,**/target/**,**/*.test.*

# Coverage
sonar.coverage.exclusions=**/test/**,**/*_test.go,**/*.test.js
