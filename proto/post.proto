syntax = "proto3";

package booster.post;

option go_package = "github.com/ikaydreams-dev/Booster-Syndrome/proto/post";

service PostService {
  rpc GetPost(GetPostRequest) returns (PostResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc CreatePost(CreatePostRequest) returns (PostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (PostResponse);
  rpc PublishPost(PublishPostRequest) returns (PostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
}

message Post {
  int32 id = 1;
  int32 user_id = 2;
  string title = 3;
  string content = 4;
  bool published = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message GetPostRequest {
  int32 id = 1;
}

message PostResponse {
  Post post = 1;
  Error error = 2;
}

message ListPostsRequest {
  int32 page = 1;
  int32 per_page = 2;
  bool published_only = 3;
}

message ListPostsResponse {
  repeated Post posts = 1;
  Pagination pagination = 2;
  Error error = 3;
}

message CreatePostRequest {
  int32 user_id = 1;
  string title = 2;
  string content = 3;
}

message UpdatePostRequest {
  int32 id = 1;
  string title = 2;
  string content = 3;
}

message PublishPostRequest {
  int32 id = 1;
}

message DeletePostRequest {
  int32 id = 1;
}

message DeletePostResponse {
  bool success = 1;
  Error error = 2;
}

message Pagination {
  int32 page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 total_pages = 4;
}

message Error {
  string code = 1;
  string message = 2;
}
