default: &default
  host: localhost
  port: 6379
  timeout: 5
  db: 0

development:
  <<: *default
  db: 0

test:
  <<: *default
  db: 1

production:
  host: <%= ENV.fetch('REDIS_HOST', 'localhost') %>
  port: <%= ENV.fetch('REDIS_PORT', 6379) %>
  password: <%= ENV['REDIS_PASSWORD'] %>
  timeout: 5
  db: 0
  pool_size: 10
