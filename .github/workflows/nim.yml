name: Nim CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/nim/**'
      - 'tests/nim/**'
      - 'nimble.nimble'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Nim
      uses: jiro4989/setup-nim-action@v1
      with:
        nim-version: '2.0.0'
        
    - name: Install dependencies
      run: nimble install -y || echo "Nimble not configured"
      
    - name: Build
      run: nim c services/nim/*.nim || echo "Nim build not configured"
      
    - name: Run tests
      run: nimble test || echo "Nimble test not configured"
