name: Haskell CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/haskell/**'
      - 'stack.yaml'
      - 'cabal.project'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Haskell
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.4.5'
        enable-stack: true
        stack-version: 'latest'
        
    - name: Cache Stack
      uses: actions/cache@v3
      with:
        path: ~/.stack
        key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml') }}
        
    - name: Build
      run: stack build || echo "Stack build not configured"
      
    - name: Test
      run: stack test || echo "Stack test not configured"
