name: Elixir CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/elixir/**'
      - 'tests/elixir/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      MIX_ENV: test

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.14'
        otp-version: '25'
        
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
        
    - name: Install dependencies
      run: |
        if [ -f mix.exs ]; then
          mix deps.get
        fi
        
    - name: Run tests
      run: |
        if [ -f mix.exs ]; then
          mix test
        fi
        
    - name: Check formatting
      run: |
        if [ -f mix.exs ]; then
          mix format --check-formatted
        fi
