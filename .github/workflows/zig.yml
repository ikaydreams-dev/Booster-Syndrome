name: Zig CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/zig/**'
      - 'build.zig'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.11.0
        
    - name: Build
      run: zig build || echo "Zig build not configured"
      
    - name: Run tests
      run: zig build test || echo "Zig test not configured"
      
    - name: Format check
      run: zig fmt --check services/zig/ || echo "Zig fmt not configured"
