name: R CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/r/**'
      - 'DESCRIPTION'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Install dependencies
      run: |
        Rscript -e 'install.packages(c("ggplot2", "dplyr", "tidyr", "readr"))' || echo "R deps not configured"
        
    - name: Check R scripts
      run: Rscript -e 'source("services/r/data_analysis.R")' || echo "R check not configured"
