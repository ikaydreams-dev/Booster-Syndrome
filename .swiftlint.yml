disabled_rules:
  - trailing_whitespace
  - force_cast
  - force_try

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - redundant_nil_coalescing

excluded:
  - Pods
  - build
  - .build

line_length:
  warning: 120
  error: 150
  ignores_comments: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 50
