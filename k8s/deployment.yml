apiVersion: apps/v1
kind: Deployment
metadata:
  name: booster-app
  labels:
    app: booster
spec:
  replicas: 3
  selector:
    matchLabels:
      app: booster
  template:
    metadata:
      labels:
        app: booster
    spec:
      containers:
      - name: app
        image: booster:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: booster-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: booster-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booster-service
spec:
  selector:
    app: booster
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
