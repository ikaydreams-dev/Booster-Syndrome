apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booster-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - booster.example.com
    secretName: booster-tls
  rules:
  - host: booster.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: booster-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: booster-service
            port:
              number: 80
